id = "mvbasic"
name = "MV BASIC (jBASE/T24)"
version = "0.1.0"
schema_version = 1
description = "MV BASIC / jBASE / T24 PickBASIC: syntax highlighting and formatter."
authors = ["zed_proj"]
languages = ["languages/mvbasic"]

[lib]
kind = "Rust"
version = "0.7.0"

# Grammar lives in this same repo; Zed clones `repository` and uses the
# sub-directory `path`. `rev` must be a commit present in the repo.
# After changing the grammar: commit, then update `rev` to the new sha.
[grammars.mvbasic]
repository = "https://github.com/oatn/zed-mvbasic"
rev = "34b077e257b9831656947a67fc33309aaeeabe52"
path = "grammars/tree-sitter-mvbasic"

[language_servers.jbasic-formatter]
languages = ["MV BASIC"]
